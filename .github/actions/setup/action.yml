name: Setup toolchain
description: Provision the mise-pinned toolchain and restore the Go module and build caches.

# Every CI job shares this action so toolchain provisioning and Go caching are
# defined once. mise.toml is the single source of truth for tool versions, so no
# job may add actions/setup-go — a second, independently pinned Go version would
# drift from go.mod. Guarded by TestWorkflowsProvisionToolchainViaSharedSetup.

runs:
  using: composite
  steps:
    # Pinned to an immutable commit: a moving tag could change what provisions the
    # toolchain without any change landing in this repository. Guarded by
    # TestActionReferencesArePinnedBySHA.
    - name: Provision toolchain
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

    # Resolved at runtime rather than hardcoded: GOCACHE is ~/.cache/go-build on
    # Linux but ~/Library/Caches/go-build on the macOS matrix leg, and under
    # LocalAppData on the Windows leg.
    - name: Resolve Go cache paths
      shell: bash
      run: |
        echo "GO_MOD_CACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
        echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

    - name: Cache Go modules and build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.GO_MOD_CACHE }}
          ${{ env.GO_BUILD_CACHE }}
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-
