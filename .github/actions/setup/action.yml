name: Setup toolchain
description: Provision the mise-pinned toolchain and restore Go caches.

runs:
  using: composite
  steps:
    - name: Provision toolchain
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

    - name: Resolve Go cache paths
      shell: bash
      run: |
        echo "GO_MOD_CACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
        echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

    - name: Cache Go modules and build output
      uses: actions/cache@v6.1.0
      with:
        path: |
          ${{ env.GO_MOD_CACHE }}
          ${{ env.GO_BUILD_CACHE }}
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-
