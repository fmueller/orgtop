name: Release

# Tag pushes publish a real GitHub Release; manual dispatch only builds a local
# snapshot so the release path can be rehearsed without publishing anything.
# Release notes come from CHANGELOG.md, and two guards refuse to publish a tag
# that has no documented section.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser derives the version and the previous tag from history.
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Validate release configuration
        run: task release:check

      # --- Tag push: real, published release ---

      - name: Guard CHANGELOG has a section for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-changelog-version.sh "${GITHUB_REF_NAME}"

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/changelog-release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Guard release notes are non-empty
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "guard: release notes file is empty; refusing to publish a release with a blank body" >&2
            exit 1
          fi
          echo "guard: release notes present ($(wc -c < "${RUNNER_TEMP}/release-notes.md") bytes)"

      - name: Run GoReleaser (publish)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --release-notes="${RUNNER_TEMP}/release-notes.md"

      # --- Manual dispatch: snapshot only, no GitHub Release ---

      - name: Run GoReleaser (snapshot, no publish)
        if: github.event_name == 'workflow_dispatch'
        run: task release:dry
