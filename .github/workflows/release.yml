name: Release

# Tag pushes publish a real GitHub Release; manual dispatch only builds a local
# snapshot so the release path can be rehearsed without publishing anything.
# Release notes come from CHANGELOG.md: a guard refuses to publish a tag whose
# section is missing or empty, and the extraction that produces the release body
# refuses the same, so a blank release body cannot reach GoReleaser.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser derives the version and the previous tag from history.
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Validate release configuration
        run: task release:check

      # --- Tag push: real, published release ---

      - name: Guard CHANGELOG documents this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-changelog-version.sh "${GITHUB_REF_NAME}"

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/changelog-release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Run GoReleaser (publish)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --release-notes="${RUNNER_TEMP}/release-notes.md"

      - name: Verify the published release body carries the notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The guards above prove the notes file is non-empty; this proves the
          # notes actually reached the published release. v0.1.0 passed every
          # earlier guard and still shipped an empty body.
          body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq '.body')"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "guard: published release ${GITHUB_REF_NAME} has an empty body" >&2
            exit 1
          fi
          expected="$(./scripts/changelog-release-notes.sh "${GITHUB_REF_NAME}")"
          if [ "$(printf '%s' "$body" | tr -d '[:space:]')" != "$(printf '%s' "$expected" | tr -d '[:space:]')" ]; then
            echo "guard: published release ${GITHUB_REF_NAME} does not carry the CHANGELOG notes" >&2
            exit 1
          fi
          echo "guard: published release ${GITHUB_REF_NAME} carries the CHANGELOG notes"

      # --- Manual dispatch: snapshot only, no GitHub Release ---

      - name: Run GoReleaser (snapshot, no publish)
        if: github.event_name == 'workflow_dispatch'
        run: task release:dry
