name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Check formatting
        run: task format-check

      - name: Vet
        run: task vet

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Build
        run: task build

      - name: Validate Taskrail
        run: task taskrail-validate

      - name: Validate release configuration
        run: task release-check
