version: 2

project_name: orgtop

builds:
  - id: orgtop
    main: ./cmd/orgtop
    binary: orgtop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/fmueller/orgtop/internal/cli.Version={{ .Version }}
    # An archive records the mtime of the file it packs. Left to the clock, one
    # tag rebuilt produces the same executable inside a differently hashed
    # archive, and RG-011's retry compares digests: the raw assets would match
    # and every archive would not. Pinning the timestamp to the tagged commit
    # makes the archive bytes a function of the tag alone. Guarded by
    # TestArchivesAreReproducibleAcrossRetries.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # The source channel: one archive per RG-011 matrix row, holding the ordinary
  # `orgtop` executable plus the license and readme.
  - id: orgtop
    ids:
      - orgtop
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # mod_timestamp pins the built executable's mtime, but an archive records
    # an mtime, owner, group, and mode for every member. actions/checkout
    # stamps the working tree with the clone time, so LICENSE and README.md
    # arrive with a fresh mtime on every run and the archive bytes move even
    # though the executable does not; the owner and group are the build
    # account's, which is not a property of the tag either. Every member's
    # metadata is pinned here, which makes the archive bytes a function of the
    # tagged commit alone and reproducible off any host, not just off an
    # identical runner. Guarded by TestArchivesAreReproducibleAcrossRetries.
    builds_info:
      mtime: "{{ .CommitDate }}"
      owner: root
      group: root
      mode: 0755
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
          mode: 0644
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
          mode: 0644

  # The GitHub CLI extension channel: the same build output, copied and renamed
  # rather than rebuilt, so the raw asset and the archived executable are the
  # byte-identical artifact RG-011 requires. The `binary` format publishes the
  # executable itself, and GoReleaser appends `.exe` on Windows, which is the
  # only place the extension names carry a suffix. Guarded by
  # TestReleasePublishesTheDistributionMatrix.
  - id: gh-extension
    ids:
      - orgtop
    formats:
      - binary
    name_template: "gh-orgtop-{{ .Os }}-{{ .Arch }}"

# One checksums.txt covers all twelve published artifacts. RG-011 requires it
# sorted bytewise by asset name with two spaces before the name, which is the
# `sha256sum` format GoReleaser emits; scripts/distribution-verify.sh proves the
# ordering before anything is published.
checksum:
  name_template: checksums.txt

# The source release is created as a draft and stays unpublished until every
# channel reconciles. Nothing built becomes anonymously downloadable before the
# release workflow flips it, which is the staged visibility A-072 requires.
release:
  draft: true
  prerelease: false
  # GoReleaser creates or reuses the draft, but the release API upload is
  # delegated to distribution-upload-assets.sh. Its compare-before-upload
  # boundary is the only safe retry behavior: GoReleaser's keep-existing mode
  # still attempts every upload, while replace_existing_artifacts overwrites
  # an asset whose bytes are already public.
  skip_upload: true
  # A draft is invisible to GitHub's get-release-by-tag endpoint, which is how
  # the release is resolved, so without this a retry of a tag whose release is
  # still a draft creates a second draft for the same tag instead of reusing
  # the first. Two releases for one tag is the contradictory same-version state
  # RG-011 refuses, and it would surface only later, as a digest mismatch that
  # reads like a rebuild. Guarded by TestReleaseReusesTheExistingDraft.
  use_existing_draft: true
  # An existing draft is reused and missing assets are added; an asset already
  # present is never overwritten, so a retry of the same tag cannot replace
  # published bytes.
  mode: keep-existing

# The changelog pipe must stay ENABLED. GoReleaser reads `--release-notes`
# inside this pipe (internal/pipe/changelog), and its Skip() returns early on
# `disable: true` — so disabling it silently discards the extracted CHANGELOG
# section and publishes an empty release body. The pipe returns before any
# generation once `--release-notes` is set, so CHANGELOG.md stays the only
# source of notes on the tag path.
changelog:
  use: git
