version: "3"

# Task targets are the developer and CI interface. Direct Go commands remain
# canonical and work without Task or mise. Target names follow a `group:verb`
# convention; the older flat names survive as aliases.
tasks:
  build:
    desc: Build the orgtop CLI
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build ./cmd/orgtop

  build:cross:
    desc: Cross-compile ./cmd/orgtop for every release target (compile smoke; publishes nothing)
    # Pure GOOS/GOARCH compile check for the platforms .goreleaser.yml ships to.
    # `-o /dev/null` keeps it a smoke rather than an artifact build. Guarded by
    # TestTaskfileCrossTargetsCoverReleasePlatforms.
    env:
      CGO_ENABLED: "0"
    cmds:
      - GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/orgtop
      - GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/orgtop
      - GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/orgtop
      - GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/orgtop
      - GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/orgtop
      - GOOS=windows GOARCH=arm64 go build -o /dev/null ./cmd/orgtop

  test:
    desc: Run all tests
    # CGO_ENABLED=0 matches how every build path links, so the suite exercises
    # the same pure-Go dependencies the published binary ships with. Guarded by
    # TestEveryBuildPathDisablesCGO.
    env:
      CGO_ENABLED: "0"
    cmds:
      - go test ./...

  test-commit-msg:
    desc: Test the commit-message policy
    cmds:
      - scripts/check-commit-msg-test.sh

  test:push-messages:
    desc: Test the pre-push attribution guard
    cmds:
      - scripts/check-push-messages-test.sh

  test:author:
    desc: Test the agent-identity author guard
    cmds:
      - scripts/check-author-test.sh

  test:changelog:
    desc: Test the changelog release guards
    cmds:
      - scripts/check-changelog-test.sh

  test:distribution:
    desc: Test the multi-channel distribution guards
    # The guards only ever run inside the release workflow, against companion
    # repositories this suite must not touch, so their decisions are exercised
    # against fixtures instead. Guarded by TestDistributionGuardsAreExercised.
    cmds:
      - scripts/distribution-test.sh

  # The differential run stays on the five mutators gremlins enables by default,
  # so the per-change loop stays cheap. The weekly gate below widens the mutator
  # set instead, where the extra runtime is affordable.
  test:mutate:
    desc: Run mutation tests for changes since BASE (default main)
    vars:
      BASE: '{{.BASE | default "main"}}'
    cmds:
      - go clean -testcache
      - go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash --diff '{{.BASE}}' --exclude-files 'cmd/.*' --output-statuses lt --workers 2

  test:mutate:packages:
    desc: List the packages the weekly mutation gate shards across, as a JSON array
    # One source for the shard list. mutation.yml builds its matrix from this
    # rather than naming packages in YAML, so a package added this week is
    # mutated this week instead of sitting outside the gate unnoticed. cmd/ is
    # excluded here for the same reason the gate excludes it by regexp.
    # Guarded by TestMutationGateShardsPerPackage.
    silent: true
    cmds:
      - |
        set -eu -o pipefail
        go list -f '{{`{{if .GoFiles}}{{.Dir}}{{end}}`}}' ./... \
          | sed "s|^{{.ROOT_DIR}}/||" \
          | grep -v '^cmd/' \
          | jq -Rsc 'split("\n") | map(select(length > 0))'

  test:mutate:gate:
    desc: Run the full weekly mutation gate across every mutator, optionally scoped to PACKAGE
    vars:
      # The package the run mutates. The weekly workflow scopes each shard to one
      # package so a hosted runner finishes it well inside its wall clock; the
      # default mutates the whole module, which is what a local full run wants.
      PACKAGE: '{{.PACKAGE | default "."}}'
      # The six mutators gremlins leaves off by default. Together they add about
      # a quarter more mutants over the default set, which only the weekly gate
      # pays for. The gate also widens the per-mutant timeout: the cache suite
      # waits out its retry bounds under mutation, and at the default coefficient
      # 280 of its 293 mutants time out instead of returning a verdict, which
      # reports a fabricated 100% efficacy for the package.
      MUTATORS: >-
        --invert-logical --invert-loopctrl --invert-assignments
        --invert-bitwise --invert-bwassign --remove-self-assignments
    cmds:
      - go clean -testcache
      # gremlins runs one test binary per worker. The gate owns a whole runner, so
      # it takes every core a hosted one has; the differential lane stays at two
      # because it shares a developer's machine with whatever else runs there.
      # Guarded by TestMutationGateUsesEveryRunnerCore.
      #
      # gremlins walks the module directory, so a nested worktree checkout under
      # .claude/worktrees/ is scanned as a second copy of the source and reports
      # a fabricated figure. Excluding it keeps the run independent of whatever
      # an agent left on disk.
      - go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash --exclude-files 'cmd/.*' --exclude-files '\.claude/.*' {{.MUTATORS}} --output-statuses lt --workers 4 --timeout-coefficient 20 --threshold-efficacy 85 '{{.PACKAGE}}'

  test:mutate:floor:
    desc: Enforce the per-package mutation efficacy floor from the gate's report
    # The gate runs one shard per package, and this grades the same report the
    # shard already wrote; it never runs gremlins a second time. It carries the
    # figure gremlins' own --threshold-efficacy carries, so a merged report and
    # a shard cannot disagree about which packages hold the floor. Guarded by
    # TestMutationFloorIsEnforcedPerPackage.
    #
    # This target is the one place the floor is written. mutation.yml reports the
    # per-package table by calling it rather than repeating the figure, so a
    # published table can never be measured against a floor nothing gates.
    # Silent so the workflow's markdown carries the table alone.
    silent: true
    vars:
      REPORT: '{{.REPORT | default "mutation-results.json"}}'
    cmds:
      - scripts/check-mutation-floor.sh --floor 85 --report '{{.REPORT}}'

  test:mutation-floor:
    desc: Test the per-package mutation efficacy guard
    cmds:
      - scripts/check-mutation-floor-test.sh

  run:smoke:
    desc: Start orgtop and require a clean exit (startup smoke)
    # Runs the command rather than only compiling it, so a binary that panics
    # before reaching its first output reds CI. `go run` keeps the target
    # identical on the native Windows matrix leg, where the built artifact is
    # orgtop.exe. `--help` is the only launch that exits cleanly without a
    # terminal, a credential, or a selected Scope.
    cmds:
      - go run ./cmd/orgtop --help

  fmt:
    aliases: [format]
    desc: Format all Go files
    cmds:
      - gofmt -w .

  fmt:check:
    aliases: [format-check]
    desc: Fail if any Go file needs formatting
    cmds:
      - |
        out="$(gofmt -l .)"
        if [ -n "$out" ]; then
          echo "The following files need gofmt:" >&2
          echo "$out" >&2
          exit 1
        fi

  lint:
    desc: Run golangci-lint across all packages
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...

  licenses:check:
    desc: Fail if any dependency license is outside the allowed set
    cmds:
      - go-licenses check ./... --include_tests --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

  workflow:validate:
    aliases: [taskrail-validate]
    desc: Validate Taskrail specs, tasks, and managed state
    cmds:
      - taskrail validate

  workflow:verify:spec:
    desc: Report advisory tracked-work coverage against the active milestone spec
    cmds:
      - taskrail coverage

  release:check:
    aliases: [release-check]
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:dry:
    desc: Build a local release snapshot without publishing anything
    cmds:
      - goreleaser release --snapshot --clean

  check:
    desc: Run the local CI checks
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test
      - task: test-commit-msg
      - task: test:push-messages
      - task: test:author
      - task: test:changelog
      - task: test:distribution
      - task: test:mutation-floor
      - task: build
      - task: run:smoke
      - task: licenses:check
      - task: workflow:validate
      - task: workflow:verify:spec
      - task: release:check

  clean:
    desc: Remove generated build and release artifacts
    cmds:
      - rm -rf orgtop orgtop.exe bin dist

  hooks-install:
    desc: Install opt-in Lefthook git hooks
    cmds:
      - lefthook install
