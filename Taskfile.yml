version: "3"

# Task targets are the developer and CI interface. Direct Go commands remain
# canonical and work without Task or mise. Target names follow a `group:verb`
# convention; the older flat names survive as aliases.
tasks:
  build:
    desc: Build the orgtop CLI
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build ./cmd/orgtop

  build:cross:
    desc: Cross-compile ./cmd/orgtop for every release target (compile smoke; publishes nothing)
    # Pure GOOS/GOARCH compile check for the platforms .goreleaser.yml ships to.
    # `-o /dev/null` keeps it a smoke rather than an artifact build. Guarded by
    # TestTaskfileCrossTargetsCoverReleasePlatforms.
    env:
      CGO_ENABLED: "0"
    cmds:
      - GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/orgtop
      - GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/orgtop
      - GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/orgtop
      - GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/orgtop
      - GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/orgtop
      - GOOS=windows GOARCH=arm64 go build -o /dev/null ./cmd/orgtop

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test-commit-msg:
    desc: Test the commit-message policy
    cmds:
      - scripts/check-commit-msg-test.sh

  test:changelog:
    desc: Test the changelog release guards
    cmds:
      - scripts/check-changelog-test.sh

  test:mutate:
    desc: Run mutation tests for changes since BASE (default main)
    vars:
      BASE: '{{.BASE | default "main"}}'
    cmds:
      - go clean -testcache
      - go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash --diff '{{.BASE}}' --exclude-files 'cmd/.*' --output-statuses lt --workers 2

  test:mutate:gate:
    desc: Run the full weekly mutation gate
    cmds:
      - go clean -testcache
      - go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash --exclude-files 'cmd/.*' --output-statuses lt --workers 2 --threshold-efficacy 70

  run:smoke:
    desc: Start orgtop and require a clean exit (startup smoke)
    # Runs the command rather than only compiling it, so a binary that panics
    # before reaching its first output reds CI. `go run` keeps the target
    # identical on the native Windows matrix leg, where the built artifact is
    # orgtop.exe. `--help` is the only launch that exits cleanly without a
    # terminal, a credential, or a selected Scope.
    cmds:
      - go run ./cmd/orgtop --help

  fmt:
    aliases: [format]
    desc: Format all Go files
    cmds:
      - gofmt -w .

  fmt:check:
    aliases: [format-check]
    desc: Fail if any Go file needs formatting
    cmds:
      - |
        out="$(gofmt -l .)"
        if [ -n "$out" ]; then
          echo "The following files need gofmt:" >&2
          echo "$out" >&2
          exit 1
        fi

  lint:
    desc: Run golangci-lint across all packages
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...

  licenses:check:
    desc: Fail if any dependency license is outside the allowed set
    cmds:
      - go-licenses check ./... --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

  workflow:validate:
    aliases: [taskrail-validate]
    desc: Validate Taskrail specs, tasks, and managed state
    cmds:
      - taskrail validate

  workflow:verify:spec:
    desc: Report advisory tracked-work coverage against the active milestone spec
    cmds:
      - taskrail coverage

  release:check:
    aliases: [release-check]
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:dry:
    desc: Build a local release snapshot without publishing anything
    cmds:
      - goreleaser release --snapshot --clean

  check:
    desc: Run the local CI checks
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test
      - task: test:changelog
      - task: build
      - task: run:smoke
      - task: licenses:check
      - task: workflow:validate
      - task: workflow:verify:spec
      - task: release:check

  clean:
    desc: Remove generated build and release artifacts
    cmds:
      - rm -rf orgtop orgtop.exe bin dist

  hooks-install:
    desc: Install opt-in Lefthook git hooks
    cmds:
      - lefthook install
