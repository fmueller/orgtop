# Local git hooks for OrgTop (opt-in).
#
# Install with `task hooks-install`. The hooks mirror fast CI checks; CI remains
# authoritative. Lefthook is pinned in mise.toml.
pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: |
        unformatted="$(gofmt -l {staged_files})"
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
    vet:
      glob: "*.go"
      run: task vet
    workflow-validate:
      glob: "{planning/**,specs/**,.taskrail/**}"
      run: task workflow:validate
    commit-message-checker:
      glob: "{lefthook.yml,Taskfile.yml,scripts/check-commit-msg.sh,scripts/check-attribution.sh,scripts/check-commit-msg-test.sh}"
      run: task test-commit-msg
    push-message-checker:
      glob: "{lefthook.yml,Taskfile.yml,scripts/check-push-messages.sh,scripts/check-attribution.sh,scripts/check-push-messages-test.sh}"
      run: task test:push-messages
    changelog-guard-checker:
      glob: "{lefthook.yml,Taskfile.yml,scripts/check-changelog-version.sh,scripts/changelog-release-notes.sh,scripts/check-changelog-test.sh}"
      run: task test:changelog

commit-msg:
  commands:
    message-policy:
      run: bash scripts/check-commit-msg.sh {1}

pre-push:
  commands:
    # The message guard runs before the suite: a push that has to be rewritten
    # anyway should not first pay for the tests.
    message-policy:
      priority: 1
      run: bash scripts/check-push-messages.sh
    tests:
      priority: 2
      run: task test
